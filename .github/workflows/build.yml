name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o hajimi-fps.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get install -y imagemagick
      - run: npm install
      - name: Bundle three.js locally
        run: mkdir -p www/lib && cp node_modules/three/build/three.module.min.js node_modules/three/build/three.core.min.js www/lib/ 2>/dev/null || cp node_modules/three/build/three.module.min.js www/lib/
      - run: npx cap add android
      - name: Icon, name, landscape
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do convert icon.png -resize ${s}x${s}! $R/mipmap-$d/$n.png; done
          done
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">哈基米枪战</string>#;s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">哈基米枪战</string>#' $R/values/strings.xml
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: hajimi-fps-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
